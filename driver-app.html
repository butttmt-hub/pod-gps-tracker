<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1117">
<title>แอปคนขับ · POD Track Delivery</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:rgba(255,255,255,0.07);
    --accent:#4f8ef7; --accent2:#7c6cf7; --green:#34d399; --orange:#fb923c; --red:#f87171;
    --text:#f1f5f9; --muted:#64748b; --muted2:#94a3b8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;
    display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;}
  .header-logo{width:36px;height:36px;border-radius:10px;background:#fff;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;padding:3px;}
  .header-logo img{width:100%;height:100%;object-fit:contain;}
  .header-title{font-size:15px;font-weight:800;}
  .header-sub{font-size:11px;color:var(--muted);}
  .conn-pill{margin-left:auto;display:flex;align-items:center;gap:5px;border-radius:20px;padding:4px 10px;
    font-size:11px;font-weight:700;border:1px solid var(--border);}
  .conn-pill.on{background:rgba(52,211,153,0.12);border-color:rgba(52,211,153,0.25);color:var(--green);}
  .conn-pill.off{background:rgba(248,113,113,0.12);border-color:rgba(248,113,113,0.25);color:var(--red);}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .install-banner{display:none;background:rgba(79,142,247,0.12);border-bottom:1px solid var(--border);
    padding:10px 16px;font-size:12px;color:var(--accent);align-items:center;gap:10px;}
  .install-banner.show{display:flex;}
  .install-banner button{margin-left:auto;background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;}

  .content{flex:1;padding:18px 16px;display:flex;flex-direction:column;gap:16px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;}
  .field-label{font-size:12px;font-weight:700;color:var(--muted2);margin-bottom:6px;display:block;}
  .field-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;font-size:15px;color:var(--text);font-family:inherit;}
  .btn{width:100%;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;margin-top:12px;}
  .btn-primary:disabled{opacity:0.6;}

  .link-btn{width:100%;background:none;border:none;color:var(--accent);font-size:12px;font-weight:700;
    padding:10px 0 0;cursor:pointer;font-family:inherit;text-align:center;}
  .search-msg{font-size:12px;color:var(--muted2);margin-top:10px;text-align:center;line-height:1.5;min-height:0;}
  .search-msg.err{color:var(--red);}

  .order-item{background:var(--surface2);border:1px solid var(--border);border-radius:12px;
    padding:14px;margin-top:10px;cursor:pointer;transition:border-color .15s;}
  .order-item:active{border-color:var(--accent);}
  .order-item-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .order-item-id{font-size:13px;font-weight:800;}
  .order-item-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;
    background:rgba(79,142,247,0.12);color:var(--accent);border:1px solid rgba(79,142,247,0.25);white-space:nowrap;}
  .order-item-sub{font-size:12px;color:var(--muted2);margin-top:6px;}

  .footer-note{text-align:center;font-size:11px;color:var(--muted);padding:10px 16px 18px;line-height:1.6;}
</style>
</head>
<body>

<div class="header">
  <div class="header-logo"><img src="icon-192.png" alt="POD Track Delivery"></div>
  <div>
    <div class="header-title">POD Track · แอปคนขับ</div>
    <div class="header-sub">ค้นหางานด้วยทะเบียนรถ</div>
  </div>
  <div class="conn-pill off" id="connPill"><span class="dot"></span><span id="connText">ออฟไลน์</span></div>
</div>

<div class="install-banner" id="installBanner">
  <span>📲 ติดตั้งแอปนี้ลงเครื่องเพื่อใช้งานได้ลื่นขึ้น</span>
  <button id="btnInstall">ติดตั้ง</button>
</div>

<div class="content">

  <!-- Login: search by plate -->
  <div class="card" id="loginCard">
    <label class="field-label">ทะเบียนรถ</label>
    <input class="field-input" id="plateInput" placeholder="เช่น 1กข-1234" autocapitalize="characters">
    <button class="btn btn-primary" id="btnSearch">🔍 ค้นหางานที่มอบหมาย</button>
    <div class="search-msg" id="searchMsg"></div>
    <button class="link-btn" id="btnManualToggle" type="button">พิมพ์รหัสออเดอร์เอง</button>
    <div id="manualBox" style="display:none;">
      <label class="field-label" style="margin-top:10px;">รหัสออเดอร์ / เลขที่งาน</label>
      <input class="field-input" id="orderIdInput" placeholder="เช่น TMT20260811001" autocapitalize="characters">
      <button class="btn btn-primary" id="btnStartManual">▶️ ไปหน้าเริ่มงาน</button>
    </div>
  </div>

  <!-- Order picker: shown when a plate has more than one active job -->
  <div class="card" id="orderPickerCard" style="display:none;">
    <label class="field-label" id="orderPickerLabel">เลือกงาน</label>
    <div id="orderList"></div>
    <button class="link-btn" id="btnPickerBack" type="button">← ค้นหาใหม่</button>
  </div>

</div>

<div class="footer-note">
  🔍 ค้นหาทะเบียนแล้วระบบจะพาไปหน้าเริ่มงานจัดส่ง (แผนที่ + ETA) ให้อัตโนมัติ<br>
  ถ้ามีมากกว่า 1 งานที่ยังไม่จบ จะให้เลือกงานก่อนไปต่อ
</div>

<script>
  firebase.initializeApp({
    apiKey: "AIzaSyBwNfPT-jBpz8p6iNNM6_l6yHnsw4xPGpo",
    authDomain: "statustracking-mockup.firebaseapp.com",
    databaseURL: "https://statustracking-mockup-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "statustracking-mockup",
    storageBucket: "statustracking-mockup.firebasestorage.app",
    messagingSenderId: "423417745590",
    appId: "1:423417745590:web:2a90c40b718fce6d61d617"
  });
  const db = firebase.database();

  // --- Online/offline pill ---
  function updateConnPill(){
    const pill = document.getElementById('connPill');
    const txt  = document.getElementById('connText');
    if (navigator.onLine){ pill.className='conn-pill on'; txt.textContent='ออนไลน์'; }
    else { pill.className='conn-pill off'; txt.textContent='ออฟไลน์'; }
  }
  window.addEventListener('online', updateConnPill);
  window.addEventListener('offline', updateConnPill);
  updateConnPill();

  // --- This page is just a launcher: find the order, then hand off to index.html ---
  // index.html?order=<id> already does the real job (GPS broadcast, map, ETA, multi-stop, resume)
  function goToOrder(id){
    window.location.href = 'index.html?order=' + encodeURIComponent(id);
  }

  const STATUS_LABEL = {pending:'รอเริ่มงาน', delivering:'กำลังจัดส่ง', nearby:'ใกล้ถึงแล้ว', arrived:'ถึงแล้ว', cancelled:'ยกเลิก'};

  function searchByPlate(plate){
    const msg = document.getElementById('searchMsg');
    const btn = document.getElementById('btnSearch');
    msg.className = 'search-msg'; msg.textContent = 'กำลังค้นหางาน...';
    btn.disabled = true;

    db.ref('orders').orderByChild('driver/plate').equalTo(plate).once('value')
      .then(snap => {
        btn.disabled = false;
        const data = snap.val() || {};
        const entries = Object.entries(data).filter(([id, o]) => o && o.status !== 'arrived' && o.status !== 'cancelled');

        if (entries.length === 0){
          msg.className = 'search-msg err';
          msg.textContent = 'ไม่พบงานที่มอบหมายให้ทะเบียนนี้ ลองตรวจสอบเลขทะเบียน หรือกรอกรหัสออเดอร์เอง';
          return;
        }
        msg.textContent = '';
        if (entries.length === 1){
          goToOrder(entries[0][0]);
          return;
        }
        renderOrderPicker(entries, plate);
      })
      .catch(err => {
        btn.disabled = false;
        console.warn('search error', err);
        msg.className = 'search-msg err';
        msg.textContent = 'ค้นหาไม่สำเร็จ (เชื่อมต่อไม่ได้) ลองใหม่ หรือกรอกรหัสออเดอร์เอง';
      });
  }

  function renderOrderPicker(entries, plate){
    const list = document.getElementById('orderList');
    list.innerHTML = '';
    entries.forEach(([id, o]) => {
      const stop1 = o.stops && (o.stops[1] || o.stops[Object.keys(o.stops)[0]]);
      const cust  = stop1 && stop1.customer;
      const sub   = cust ? (cust.name || cust.address || '') : '';
      const stopsInfo = o.totalStops > 1 ? ` · ${o.totalStops} จุดส่ง` : '';
      const div = document.createElement('div');
      div.className = 'order-item';
      div.innerHTML = `
        <div class="order-item-top">
          <span class="order-item-id">${id}</span>
          <span class="order-item-badge">${STATUS_LABEL[o.status] || o.status || '—'}</span>
        </div>
        <div class="order-item-sub">${sub}${stopsInfo}</div>`;
      div.addEventListener('click', () => goToOrder(id));
      list.appendChild(div);
    });
    document.getElementById('orderPickerLabel').textContent = `พบ ${entries.length} งานสำหรับทะเบียน ${plate} · เลือกงาน`;
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('orderPickerCard').style.display = 'block';
  }

  document.getElementById('btnPickerBack').addEventListener('click', () => {
    document.getElementById('orderPickerCard').style.display = 'none';
    document.getElementById('loginCard').style.display = 'block';
  });

  document.getElementById('btnSearch').addEventListener('click', () => {
    const plate = document.getElementById('plateInput').value.trim();
    if (!plate){ alert('กรุณากรอกทะเบียนรถ'); return; }
    searchByPlate(plate);
  });
  document.getElementById('plateInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btnSearch').click();
  });

  // --- Manual order-id fallback ---
  document.getElementById('btnManualToggle').addEventListener('click', () => {
    const box = document.getElementById('manualBox');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  });
  document.getElementById('btnStartManual').addEventListener('click', () => {
    const oid = document.getElementById('orderIdInput').value.trim();
    if (!oid){ alert('กรุณากรอกรหัสออเดอร์'); return; }
    goToOrder(oid);
  });

  // --- PWA install prompt ---
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBanner').classList.add('show');
  });
  document.getElementById('btnInstall').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('installBanner').classList.remove('show');
  });
  window.addEventListener('appinstalled', () => {
    document.getElementById('installBanner').classList.remove('show');
  });

  // --- Register service worker ---
  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW register failed', e));
    });
  }
</script>
</body>
</html>
